database:
  type: sqlite
  sqlite:
    file: beauth.db
  mysql:
    host: localhost
    port: 3306
    database: beauth
    username: root
    password: password
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
auth:
  login-timeout: 60
  max-login-attempts: 5
  brute-force-ban-duration: 300
  min-password-length: 6
  max-password-length: 64
  auto-login-ip: true
  session-duration: 24
  forbidden-passwords:
    - "123456"
    - "password"
    - "qwerty"
    - "abc123"
    - "123456789"
    - "letmein"
    - "admin"
    - "minecraft"
  bcrypt-rounds: 12
premium:
  enabled: true
  auto-login: true
  api-timeout: 5000
  uuid-verification: true
ui:
  show-join-title: true
  show-actionbar: true
  actionbar-update-interval: 40
  sounds:
    login-success:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.0
    login-fail:
      enabled: true
      sound: ENTITY_VILLAGER_NO
      volume: 1.0
      pitch: 1.0
    register-success:
      enabled: true
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
  particles:
    enabled: false
    type: TOTEM_OF_UNDYING
    count: 30
gui:
  enabled: true
security:
  rate-limit:
    enabled: true
    max-attempts: 5
    window-seconds: 60
  blocked-commands:
    enabled: true
    allowed-commands:
      - login
      - register
      - l
      - reg
  packet-protection: true
  session-tokens: true
integrations:
  placeholderapi:
    enabled: true
  luckperms:
    enabled: true
    unauth-group: unauth
  bstats:
    enabled: true
    plugin-id: 12345
  discord:
    enabled: false
    webhook-url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL"
    alert-on:
      login: true
      register: true
      failed-login: true
      premium-toggle: true
    embed-color: 5814783
  update-checker:
    enabled: true
    github-repo: "beffaxone/BeAuth"
logging:
  log-failed-logins: true
  log-successful-logins: false
  log-registrations: true
